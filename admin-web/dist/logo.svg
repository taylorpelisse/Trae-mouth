  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Trae Mouth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="0.55" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.3" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#05402A" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect width="256" height="256" rx="58" fill="url(#hl)"/>
  <rect x="0.75" y="0.75" width="254.5" height="254.5" rx="57.25" fill="none"
        stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- mark: unrotated, optically centered (bounds 55..201 x 55..203) -->
  <g filter="url(#shadow)">
    <!-- back plate -->
    <rect x="56" y="64" width="144" height="112" rx="24" fill="none"
          stroke="#ffffff" stroke-opacity="0.45" stroke-width="18"/>
    <!-- front plate -->
    <rect x="56" y="82" width="144" height="112" rx="24" fill="#0B3B26"
          stroke="#ffffff" stroke-width="18"/>
    <!-- eyes -->
    <rect x="-13" y="-13" width="26" height="26" rx="6"
          transform="translate(104 138) rotate(45)" fill="#ffffff"/>
    <rect x="-13" y="-13" width="26" height="26" rx="6"
          transform="translate(152 138) rotate(45)" fill="#ffffff"/>
  </g>
</svg>
