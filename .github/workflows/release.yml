name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Build admin frontend
        working-directory: admin-web
        run: |
          npm ci
          npm run build

      - name: Package release
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          NAME="trae-mouth-${TAG}"
          OUT="${RUNNER_TEMP}/${NAME}.zip"
          zip -r "$OUT" . \
            -x ".git/*" \
               ".github/*" \
               ".env" \
               "data/*" \
               "admin-web/node_modules/*" \
               "__pycache__/*" \
               "*/__pycache__/*" \
               ".pytest_cache/*" \
               "*.pyc" \
               "*.db" \
               "*.db-wal" \
               "*.db-shm" \
               "*.log"
          cp "$OUT" "${NAME}.zip"
          sha256sum "${NAME}.zip" > "${NAME}.zip.sha256"
          echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trae-mouth-release
          path: |
            trae-mouth-*.zip
            trae-mouth-*.zip.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "${ASSET}.sha256" \
              --title "Trae Mouth $GITHUB_REF_NAME" \
              --generate-notes
          fi
